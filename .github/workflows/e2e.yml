name: E2E (Postman + Queue/SSE)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (hermético, sem Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      # Coleção Postman (newman) contra a app Nest real em memória.
      - name: E2E - Postman collection (newman)
        run: npm run test:e2e:postman

      # N pedidos simultâneos > QUALWEB_MAX_CONCURRENCY: valida fila, posições, ordem dos eventos SSE e cancelamentos.
      - name: E2E - Queue concurrency + SSE lifecycle
        run: npm run test:e2e:queue

  queue-stability:
    name: Queue E2E - estabilidade (5 execuções)
    runs-on: ubuntu-latest
    needs: e2e
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Repeat queue E2E to catch race conditions
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::run $i"
            npm run test:e2e:queue || exit 1
            echo "::endgroup::"
          done
